<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Notas | Instituto i3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contenedor">
    <section class="tarjeta">
      <p class="etiqueta">Instituto i3</p>
      <h1>Calculadora de Notas</h1>
      <p class="descripcion">Ingresa los datos del estudiante y sus tres notas para calcular su promedio.</p>

      <form id="formulario-notas" novalidate>
        <label for="nombre">Nombre del estudiante</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ejemplo: Ana Pérez">

        <div class="notas-grid">
          <div>
            <label for="nota1">Nota 1</label>
            <input type="number" id="nota1" name="nota1" min="0" max="5" step="0.1" placeholder="0.0">
          </div>
          <div>
            <label for="nota2">Nota 2</label>
            <input type="number" id="nota2" name="nota2" min="0" max="5" step="0.1" placeholder="0.0">
          </div>
          <div>
            <label for="nota3">Nota 3</label>
            <input type="number" id="nota3" name="nota3" min="0" max="5" step="0.1" placeholder="0.0">
          </div>
        </div>

        <button type="submit">Calcular promedio</button>
        <p id="mensaje" class="mensaje" role="alert"></p>
      </form>

      <div id="resultado" class="resultado oculto" aria-live="polite"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
